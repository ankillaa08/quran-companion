services:
  - type: web
    name: quran-companion-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set to your Neon PostgreSQL connection string:
        # postgresql://<user>:<pass>@<host>/<db>?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: WHISPER_MODEL_ID
        value: tarteel-ai/whisper-base-ar-quran
      - key: USE_MOCK_ASR
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
